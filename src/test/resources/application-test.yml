spring:

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update

    show-sql: true

    properties:
      hibernate:
        format_sql: true

  sql:
    init:
      mode: never

logging:

  level:

    org.hibernate.SQL: debug

    org.hibernate.orm.jdbc.bind: trace