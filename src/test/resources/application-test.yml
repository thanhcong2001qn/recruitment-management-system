spring:

  jpa:
    hibernate:
      ddl-auto: validate

    show-sql: true

    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  sql:
    init:
      mode: never

logging:

  level:

    org.hibernate.SQL: debug

    org.hibernate.orm.jdbc.bind: trace