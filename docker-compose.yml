version: "3.9"

services:

  mysql:
    image: mysql:8.0

    container_name: recruitment_mysql

    restart: always

    ports:
      - "${DB_PORT}:3306"

    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}

    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data: